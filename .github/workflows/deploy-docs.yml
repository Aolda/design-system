name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - "packages/ui/**"
      - "packages/ui-docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.repository == 'Aolda/design-system' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build docs
        run: pnpm --filter @aolda/ui-docs build:ci

      - name: Deploy docs to Cloudflare
        run: pnpm --filter @aolda/ui-docs run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
